spring:
  application:
    name: chamados

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chamados}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 25MB

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

app:
  upload:
    dir: ${user.home}/chamados-uploads