<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Chamados acadêmicos'">Chamados acadêmicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<div th:fragment="emptyState(titulo, descricao, linkUrl, linkTexto)" class="painel empty-state">
    <h2 class="h5 mb-2" th:text="${titulo}">Nenhum registro</h2>
    <p class="mb-3" th:text="${descricao}">Não há itens para exibir.</p>
    <a class="btn btn-brand" th:href="@{${linkUrl}}" th:text="${linkTexto}">Ação</a>
</div>

<footer th:fragment="rodape" class="py-3 mt-4 border-top bg-white text-center text-secondary small">
    <div class="container">Sistema de Chamados Acadêmicos &bull; IFSP</div>
    <script th:src="@{/js/app.js}"></script>
</footer>
<body>
<header th:fragment="topo(ativo)" class="topo py-2">
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div class="d-flex flex-wrap align-items-center gap-4">
            <a class="navbar-brand text-decoration-none" th:href="@{/dashboard}">Chamados acadêmicos</a>
            <nav class="d-flex flex-wrap gap-2" aria-label="Navegação principal" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/dashboard}"
                   th:classappend="${ativo == 'dashboard'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'dashboard'} ? 'page' : null">Painel</a>
                <a class="nav-link" th:href="@{/chamados}"
                   th:classappend="${ativo == 'chamados'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'chamados'} ? 'page' : null">Chamados</a>
                <a class="nav-link" th:href="@{/chamados/novo}"
                   th:classappend="${ativo == 'novo'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'novo'} ? 'page' : null">Novo chamado</a>
                <a class="nav-link" th:href="@{/indicadores}"
                   sec:authorize="hasRole('GESTOR')"
                   th:classappend="${ativo == 'indicadores'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'indicadores'} ? 'page' : null">Indicadores</a>
            </nav>
        </div>

        <div class="d-flex align-items-center gap-3 py-2" sec:authorize="isAuthenticated()">
            <div class="text-end small">
                <div class="fw-semibold" sec:authentication="principal.nome">Usuário</div>
                <span class="badge bg-secondary" sec:authentication="principal.papel.rotulo">Perfil</span>
            </div>
            <form method="post" th:action="@{/logout}" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
            </form>
        </div>
    </div>
</header>
<div th:fragment="mensagem">
    <div class="alert alert-success" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}"></div>
</div>
</body>
</html>
