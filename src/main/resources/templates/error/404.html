<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página não encontrada (404)')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('')}"></header>
<main class="container py-5" style="max-width: 640px;">
    <div class="painel text-center py-5 px-4">
        <span class="badge bg-secondary mb-2 fs-6">Erro 404</span>
        <h1 class="h3 fw-bold mb-3">Recurso não encontrado</h1>
        <p class="text-secondary mb-4"
           th:text="${mensagem != null ? mensagem : 'O chamado ou página que você tentou acessar não existe ou foi removido.'}">
            O chamado ou página que você tentou acessar não existe ou foi removido.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-brand" th:href="@{/chamados}">Voltar para Chamados</a>
        </div>
    </div>
</main>
</body>
</html>
